
[env]
TERM = "xterm-256color"

[window]
opacity = 1
decorations = "Full"
dynamic_padding = true
startup_mode = "Fullscreen"
#dimensions = { columns = 120, lines = 40 }

[window.padding]
x = 10
y = 10

[scrolling]
history = 100000

[font]
size = 15.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
blink_interval = 500

[cursor.style]
shape = "Beam"
blinking = "On"

[selection]
save_to_clipboard = true

[colors.primary]
background = "#030f14"
foreground = "#839496"

[colors.cursor]
text = "#030f14"
cursor = "#2aa198"

[colors.selection]
text = "#93a1a1"
background = "#073642"

[colors.normal]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"

[colors.bright]
black = "#030f14"
red = "#cb4b16"
green = "#586e75"
yellow = "#657b83"
blue = "#839496"
magenta = "#6c71c4"
cyan = "#93a1a1"
white = "#fdf6e3"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
live_config_reload = true
